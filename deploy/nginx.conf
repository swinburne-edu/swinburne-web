# Nginx — swinburne-vn.edu.vn (production) + staging. CLAUDE.md mục 3.
# Chép vào /etc/nginx/sites-available/swin, ln -s sang sites-enabled, rồi:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d swinburne-vn.edu.vn -d www.swinburne-vn.edu.vn -d staging.swinburne-vn.edu.vn
# Certbot tự thêm các dòng ssl_certificate. Basic auth staging:
#   sudo htpasswd -c /etc/nginx/.htpasswd-swin-staging <tên-đăng-nhập>

# Giới hạn tốc độ form đăng ký (thêm lớp chặn spam trước app)
limit_req_zone $binary_remote_addr zone=swin_leads:10m rate=10r/m;

map $sent_http_content_type $swin_static_cache {
    default off;
    ~image/ max;
    ~font/ max;
}

# App bind HOSTNAME=localhost (xem deploy/ecosystem.config.cjs) — có thể là 127.0.0.1 hoặc ::1
upstream swin_app {
    server 127.0.0.1:3000 max_fails=0;
    server [::1]:3000 backup;
    keepalive 32;
}

upstream swin_staging_app {
    server 127.0.0.1:3100 max_fails=0;
    server [::1]:3100 backup;
    keepalive 8;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name swinburne-vn.edu.vn www.swinburne-vn.edu.vn staging.swinburne-vn.edu.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.swinburne-vn.edu.vn;
    # ssl_certificate ... (certbot)
    return 301 https://swinburne-vn.edu.vn$request_uri;
}

# ---------------------------------------------------------------- PRODUCTION
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name swinburne-vn.edu.vn;
    # ssl_certificate ... (certbot)

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Media do Nginx phục vụ trực tiếp từ MEDIA_DIR (không qua Node)
    location /media/ {
        alias /var/www/swin/media/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # SVG do biên tập viên tải lên: chặn script chạy trong file
        location ~* \.svg$ {
            alias /var/www/swin/media/;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        try_files $uri =404;
    }

    # Tài nguyên tĩnh có hash của Next
    location /_next/static/ {
        proxy_pass http://swin_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /api/leads {
        limit_req zone=swin_leads burst=5 nodelay;
        proxy_pass http://swin_app;
        include /etc/nginx/snippets/swin-proxy.conf;
    }

    location / {
        proxy_pass http://swin_app;
        include /etc/nginx/snippets/swin-proxy.conf;
    }
}

# ---------------------------------------------------------------- STAGING (noindex + basic auth)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.swinburne-vn.edu.vn;
    # ssl_certificate ... (certbot)

    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Swinburne staging";
    auth_basic_user_file /etc/nginx/.htpasswd-swin-staging;

    location /media/ {
        alias /var/www/swin-staging/media/;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://swin_staging_app;
        include /etc/nginx/snippets/swin-proxy.conf;
    }
}

